<template id="tpl-gs-onnx-probe-panel">
  <div class="panel gs-onnx-probe-panel">
    <div class="panel-head">ONNX hardware status</div>
    <div class="panel-body">
      <dl class="kv">
        <dt>Requested provider</dt>
        <dd class="gs-onnx-requested"></dd>
        <dt>Active provider (configured, unverified)</dt>
        <dd class="gs-onnx-active"></dd>
        <dt>Last verified</dt>
        <dd class="gs-onnx-verified">Not yet tested</dd>
      </dl>
      <p class="gs-field-pending-restart gs-onnx-pending-restart" hidden></p>
      <p class="gs-field-source gs-onnx-dml-runtime-note" hidden>DirectML uses the standard npm onnxruntime-node package — the managed CUDA runtime installer does not apply to DirectML.</p>
      <p class="gs-field-source gs-onnx-staged-path-notice" hidden></p>
      <p class="gs-detail gs-onnx-fallback-warning" hidden></p>
      <button type="button" class="btn-amber gs-onnx-test-button">Test configuration</button>
      <div class="gs-onnx-result" hidden>
        <dl class="kv">
          <dt>Runtime source</dt>
          <dd class="gs-onnx-runtime-source"></dd>
          <dt>Runtime version</dt>
          <dd class="gs-onnx-runtime-version"></dd>
          <dt>Model cached</dt>
          <dd class="gs-onnx-model-cached"></dd>
          <dt>Managed runtime</dt>
          <dd class="gs-onnx-managed-runtime">—</dd>
        </dl>
        <p class="gs-detail gs-onnx-message"></p>
        <div class="gs-onnx-diagnosis" hidden>
          <p class="gs-detail gs-onnx-diagnosis-details"></p>
          <ul class="gs-onnx-diagnosis-steps"></ul>
        </div>
      </div>
    </div>
  </div>
</template>
