<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>semidex admin</title>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-bracket">[</span>semidex<span class="brand-bracket">]</span>
    <span class="brand-sub">admin console</span>
  </div>
  <div class="topbar-status" id="topbar-status">
    <button type="button" class="job-chip" id="job-chip" hidden></button>
    <span class="lamp lamp-unknown" id="health-lamp" title="storage status"></span>
    <span class="mono" id="health-text">probing…</span>
    <span class="cap-summary mono" id="cap-summary"></span>
    <a href="#/settings" class="topbar-gear-link" id="nav-global-settings" aria-label="Semidex settings" title="Semidex settings"></a>
  </div>
</header>

<div class="layout">
  <nav class="sidebar">
    <div id="collection-nav">
      <ul class="nav-list">
        <li><a href="#/index" id="nav-index">Create a collection</a></li>
      </ul>
      <div class="panel-label">Collections</div>
      <ul class="collection-list" id="collection-list">
        <li class="muted">loading…</li>
      </ul>
    </div>
    <div class="settings-nav" id="settings-nav" hidden>
      <div class="panel-label">Settings</div>
      <ul class="nav-list" id="settings-nav-list"></ul>
    </div>
    <div class="sidebar-foot mono">local · 127.0.0.1</div>
  </nav>

  <div class="sidebar-resize-handle" id="sidebar-resize-handle" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" tabindex="0"></div>

  <main class="main" id="main">
    <!-- views rendered by app.js -->
  </main>
</div>

<div id="toast-host" class="toast-host" aria-live="polite" aria-atomic="false"></div>

<!-- Application-shell-level modal mount point (Phase 3S) — outside #main,
     same "survives every view swap" placement as #toast-host above. -->
<div id="operation-modal-host"></div>

<load src="partials/templates/delete-modal.html" />
<load src="partials/templates/search-result.html" />
<load src="partials/templates/chunk-card.html" />
<load src="partials/templates/file-view-header.html" />
<load src="partials/templates/assembly-segment.html" />
<load src="partials/templates/reader-mode-toggle.html" />
<load src="partials/templates/assembly-warning.html" />
<load src="partials/templates/job-row.html" />
<load src="partials/templates/operation-modal.html" />
<load src="partials/templates/empty-state.html" />
<load src="partials/templates/error-state.html" />
<load src="partials/templates/global-settings.html" />

<script type="module" src="/main.js"></script>
</body>
</html>
