<template id="tpl-search-result">
  <div class="result-card">
    <div class="result-head">
      <span class="rank"></span>
      <span class="mono score" title="Rank score — compare order, not absolute value" hidden></span>
      <span class="mono result-source"></span>
      <span class="mono muted result-chunk-index"></span>
      <span class="muted result-section"></span>
      <span class="badge badge-amber result-node-type" hidden></span>
      <button type="button" class="mini-btn result-open" hidden>open</button>
    </div>
    <div class="chunk-context" hidden></div>
    <pre class="chunk-text"></pre>
    <div class="win-chunks" hidden></div>
  </div>
</template>

<template id="tpl-window-chunk">
  <div class="win-chunk">
    <div class="win-head">
      <span class="mono muted win-chunk-index"></span>
      <span class="badge badge-amber" hidden>match</span>
      <span class="muted win-section"></span>
    </div>
    <div class="win-text"></div>
  </div>
</template>
