<template id="tpl-chunk-card">
  <div class="chunk">
    <div class="chunk-head">
      <span class="chunk-index-label"></span>
      <span class="chunk-section"></span>
      <span class="badge badge-amber chunk-node-type" hidden></span>
    </div>
    <div class="chunk-context" hidden>
      <span class="chunk-context-label"></span>
      <span class="chunk-context-text"></span>
    </div>
    <pre class="chunk-text"></pre>
  </div>
</template>
