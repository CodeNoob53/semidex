<template id="tpl-global-settings-shell">
  <div class="global-settings-shell">
    <h1 class="view-title">Settings</h1>
    <div id="gs-inline-category-mount"></div>
    <div id="gs-content"></div>
  </div>
</template>

<template id="tpl-gs-status-panel">
  <div class="panel">
    <div class="panel-head gs-status-title"></div>
    <div class="panel-body">
      <dl class="kv gs-status-rows"></dl>
      <div class="gs-status-message" hidden>
        <p class="gs-detail"></p>
        <p class="gs-detail-sub" hidden></p>
      </div>
      <div class="gs-provenance-mount"></div>
    </div>
  </div>
</template>

<template id="tpl-gs-kv-row">
  <dt></dt>
  <dd></dd>
</template>

<template id="tpl-gs-badge">
  <span class="badge"></span>
</template>

<template id="tpl-gs-provenance">
  <details class="gs-provenance">
    <summary>Where these values came from</summary>
    <dl class="kv"></dl>
  </details>
</template>

<template id="tpl-gs-provider-placeholder">
  <div class="gs-placeholder">
    <p><strong></strong> — currently implemented.</p>
    <p class="gs-field-desc"></p>
  </div>
</template>

<template id="tpl-gs-field">
  <div class="gs-field">
    <label class="gs-field-label"></label>
    <div class="gs-field-control-mount"></div>
    <p class="gs-field-desc"></p>
    <p class="gs-field-source">
      <span class="badge badge-warn gs-field-lock" hidden>locked</span>
      <span class="gs-field-source-text"></span>
      <button type="button" class="btn-ghost gs-field-reset" hidden>Use inherited value</button>
    </p>
    <p class="gs-field-pending-restart" data-message="pending-restart" hidden></p>
    <p class="gs-field-pending-restart" data-message="shadowed" hidden></p>
    <p class="gs-field-pending-restart" data-message="invalid-configuration" hidden></p>
    <span class="gs-field-impact"></span>
  </div>
</template>

<template id="tpl-gs-field-readonly">
  <div class="gs-field">
    <label class="gs-field-label"></label>
    <p class="gs-field-value mono"></p>
    <p class="gs-field-desc"></p>
    <p class="gs-field-source" hidden></p>
    <p class="gs-field-pending-restart" hidden></p>
  </div>
</template>

<template id="tpl-gs-field-secret">
  <div class="gs-field">
    <label class="gs-field-label"></label>
    <span class="badge gs-secret-status"></span>
    <p class="gs-field-desc"></p>
  </div>
</template>

<template id="tpl-gs-control-checkbox">
  <input type="checkbox" class="gs-field-control">
</template>

<template id="tpl-gs-control-input">
  <input type="text" class="gs-field-control q-input">
</template>

<template id="tpl-gs-control-path">
  <div class="gs-path-control">
    <input type="text" class="gs-field-control q-input gs-path-input">
    <button type="button" class="btn-ghost gs-path-browse">Browse…</button>
    <p class="gs-field-source gs-path-fallback" hidden>Folder picker unavailable — enter the path manually above.</p>
  </div>
</template>

<template id="tpl-gs-control-select">
  <select class="gs-field-control q-input"></select>
</template>

<template id="tpl-gs-option">
  <option></option>
</template>

<template id="tpl-gs-control-note">
  <p class="gs-field-source"></p>
</template>

<template id="tpl-gs-advanced">
  <details class="gs-advanced">
    <summary>Advanced settings</summary>
    <div class="gs-advanced-fields"></div>
  </details>
</template>

<template id="tpl-gs-save-bar">
  <div class="gs-save-bar">
    <span class="gs-field-source gs-save-invalid" hidden>Fix invalid fields before saving.</span>
    <button type="button" class="btn-amber" id="gs-save">Save</button>
    <button type="button" class="btn-ghost" id="gs-cancel">Cancel</button>
  </div>
</template>

<template id="tpl-gs-refresh-models">
  <button type="button" class="btn-ghost" id="gs-refresh-models">Refresh models</button>
</template>

<template id="tpl-gs-onnx-probe-panel">
  <div class="panel gs-onnx-probe-panel">
    <div class="panel-head">ONNX hardware status</div>
    <div class="panel-body">
      <dl class="kv">
        <dt>Requested provider</dt>
        <dd class="gs-onnx-requested"></dd>
        <dt>Active provider (configured, unverified)</dt>
        <dd class="gs-onnx-active"></dd>
        <dt>Last verified</dt>
        <dd class="gs-onnx-verified">Not yet tested</dd>
      </dl>
      <p class="gs-field-pending-restart gs-onnx-pending-restart" hidden></p>
      <p class="gs-field-source gs-onnx-staged-path-notice" hidden></p>
      <p class="gs-detail gs-onnx-fallback-warning" hidden></p>
      <button type="button" class="btn-amber gs-onnx-test-button">Test configuration</button>
      <div class="gs-onnx-result" hidden>
        <dl class="kv">
          <dt>Runtime source</dt>
          <dd class="gs-onnx-runtime-source"></dd>
          <dt>Runtime version</dt>
          <dd class="gs-onnx-runtime-version"></dd>
          <dt>Model cached</dt>
          <dd class="gs-onnx-model-cached"></dd>
        </dl>
        <p class="gs-detail gs-onnx-message"></p>
      </div>
    </div>
  </div>
</template>

<template id="tpl-gs-qdrant-cloud-probe-panel">
  <div class="panel gs-qdrant-cloud-probe-panel">
    <div class="panel-head">Qdrant Cloud Inference status</div>
    <div class="panel-body">
      <dl class="kv">
        <dt>Dense model</dt>
        <dd class="gs-qc-dense-model"></dd>
        <dt>Availability</dt>
        <dd><span class="badge gs-qc-availability-badge">Not yet tested</span></dd>
        <dt>Last verified</dt>
        <dd class="gs-qc-verified">Not yet tested</dd>
      </dl>
      <p class="gs-detail">This runs a real, minimal inference round-trip against a disposable collection that is created and deleted immediately — it is the only way to confirm Cloud Inference actually works for this model, not just that Qdrant is reachable.</p>
      <button type="button" class="btn-amber gs-qc-test-button">Test Cloud Inference</button>
      <div class="gs-qc-result" hidden>
        <p class="gs-detail gs-qc-message"></p>
      </div>
    </div>
  </div>
</template>

<template id="tpl-gs-inline-category">
  <select class="q-input gs-inline-category-select" aria-label="Settings category"></select>
</template>
