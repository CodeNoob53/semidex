<template id="tpl-reader-mode-toggle">
  <div class="reader-mode-toggle" role="group" aria-label="Reader mode">
    <button type="button" class="reader-mode-btn" data-mode="document" title="Read as a continuous document">Document</button>
    <button type="button" class="reader-mode-btn" data-mode="chunks" title="Inspect indexed chunks">Chunks</button>
  </div>
</template>
